<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're invited — LoveCo</title>
    <meta name="description" content="Your partner invited you to pair on LoveCo. Grab your code and join them.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
    <style>
        .pair-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            gap: 18px;
        }
        .pair-badge {
            font-size: 13px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold, #D9B976);
        }
        .pair-title { font-size: 34px; line-height: 1.15; margin: 0; }
        .pair-title span { color: var(--rose, #D45A78); }
        .pair-code {
            font-family: "SF Mono", ui-monospace, Menlo, monospace;
            font-size: 44px;
            letter-spacing: 0.3em;
            padding: 18px 26px 18px 34px;
            border-radius: 18px;
            background: var(--bg-raised, #1F1318);
            border: 1px solid var(--gold, #D9B976);
            color: var(--cream, #F2E1C9);
        }
        .pair-hint { color: var(--cream, #F2E1C9); opacity: 0.7; max-width: 420px; font-size: 15px; }
        .pair-cta {
            display: inline-block;
            background: var(--rose, #D45A78);
            color: #fff;
            font-weight: 600;
            font-size: 17px;
            padding: 16px 28px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
        .pair-copied { color: var(--gold, #D9B976); font-size: 14px; min-height: 20px; }
        .pair-open-app { color: var(--rose, #D45A78); font-size: 15px; text-decoration: underline; }
    </style>
</head>
<body>

<div class="pair-wrap">
    <div class="pair-badge">💌 You're invited</div>
    <h1 class="pair-title">Your partner is waiting<br><span>on LoveCo.</span></h1>

    <div class="pair-code" id="code">······</div>
    <div class="pair-copied" id="copied"></div>

    <button class="pair-cta" id="cta">Copy code &amp; get the app</button>
    <p class="pair-hint">Install LoveCo, tap <strong>“My partner invited me”</strong>, and your code will be one paste away.</p>

    <a class="pair-open-app" id="openApp" href="#" style="display:none">Already have the app? Open it</a>
</div>

<script>
(function () {
    var APP_STORE = "https://apps.apple.com/app/loveco/id6757470996";

    // Code arrives as ?c=483920 (primary) or /pair/483920 (future-proofing).
    var code = new URLSearchParams(location.search).get("c") || "";
    if (!/^\d{6}$/.test(code)) {
        var m = location.pathname.match(/\d{6}/);
        code = m ? m[0] : "";
    }

    var codeEl = document.getElementById("code");
    var cta = document.getElementById("cta");
    var copied = document.getElementById("copied");
    var openApp = document.getElementById("openApp");

    if (code) {
        codeEl.textContent = code;
        // Custom scheme, NOT the universal link: tapping a universal
        // link on the same page in Safari just reloads the page. The
        // loveco:// scheme hands off to the app directly (and no-ops
        // if the app isn't installed).
        openApp.style.display = "inline";
        openApp.href = "loveco://pair?c=" + code;
    } else {
        codeEl.textContent = "——————";
        cta.textContent = "Get the app";
    }

    cta.addEventListener("click", function () {
        if (code && navigator.clipboard) {
            navigator.clipboard.writeText(code).then(function () {
                copied.textContent = "Code copied — see you inside 💛";
            }).catch(function () {});
        }
        // Small delay so the copy lands before we leave the page.
        setTimeout(function () { location.href = APP_STORE; }, 350);
    });
})();
</script>

</body>
</html>
